[plugin]
name = "剪贴板猫娘"
description = "监听主人的剪贴板，猫娘看到你复制了什么就主动搭话喵：链接要不要看看、代码要不要帮忙、英文要不要翻译、长文要不要总结。隐私优先——疑似密码/密钥的内容看都不看，全部本地处理；节奏可控，绝不做话痨猫。v0.4.0 内置「猫娘塔罗」：78 张莱德-伟特真卡面（公有领域）+ 三种牌阵 + 猫娘 LLM 解读。"
short_description = "Catgirl watches your clipboard and offers help; privacy-first, rate-limited. Now with a 78-card catgirl tarot reading."
keywords = ["剪贴板", "clipboard", "感知", "awareness", "主动", "proactive", "猫娘", "neko", "翻译", "translate", "监听", "watcher", "塔罗", "tarot", "占卜"]
version = "0.4.1"
type = "plugin"
id = "neko_clipboard_watcher"
entry = "plugin.plugins.neko_clipboard_watcher:ClipboardWatcherPlugin"

[plugin.author]
name = "MENGYAOYUE"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[neko_clipboard_watcher]
# 剪贴板轮询间隔（秒，最小 1）
poll_interval_seconds = 2
# 两次主动搭话的最小间隔（秒，最小 2）
cooldown_seconds = 5
# 每小时最多主动搭话次数
max_per_hour = 30

# ── 面板声明：有了它，宿主插件管理里才会出现「打开界面」入口 ──────
[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "剪贴板猫娘 · 管理面板"
entry = "static/index.html"
context = "neko_clipboard_watcher"
permissions = ["state:read", "action:call"]
